name: Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run platform release-shape gate
        run: ./gradlew releaseCheck
      - name: Build isolated capability matrix
        run: ./gradlew -p samples/smoke-app check assembleDebug
      - name: Build published-artifact capability matrix
        run: |
          ./gradlew -p samples/smoke-app \
            -PmagicAndroidPlatformRepositoryPath=../../build/publication-verification-repository \
            clean check assembleDebug
