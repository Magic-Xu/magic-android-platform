name: Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test platform plugins
        run: ./gradlew platformCheck publicationCheck
      - name: Build isolated capability matrix
        run: ./gradlew -p samples/smoke-app check assembleDebug
      - name: Build published-artifact capability matrix
        run: |
          ./gradlew -p samples/smoke-app \
            -PmagicAndroidPlatformRepositoryPath=../../build/publication-verification-repository \
            clean check assembleDebug
